name: Compilar APK Automático

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: 5. Compilar APK (Debug)
        run: ./gradlew assembleDebug

      - name: 6. Guardar archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-multimodal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
