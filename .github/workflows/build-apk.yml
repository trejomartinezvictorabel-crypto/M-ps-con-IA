name: Compilar APK Automático

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.4 y Android SDK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. Aceptar licencias y compilar APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. Guardar archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-multimodal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
