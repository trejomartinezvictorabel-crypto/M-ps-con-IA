name: Compilar APK Automático

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Aceptar licencias y preparar Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 4. Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: 5. Compilar APK (Debug)
        run: ./gradlew assembleDebug

      - name: 6. Guardar archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-multimodal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
