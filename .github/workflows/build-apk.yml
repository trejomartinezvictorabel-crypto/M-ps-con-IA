name: Compilar APK Directo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Preparar entorno y descargar Android SDK
        run: |
          echo "Instalando herramientas de compilación..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          
          # Descargar Command Line Tools oficiales de Android
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # Configurar variables de entorno
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Aceptar licencias automáticamente
          yes | sdkmanager --licenses || true
          
          # Instalar plataforma Android y compilador
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

          # Crear un proyecto de prueba mínimo y compilarlo directamente con aapt y apksigner
          echo "El entorno está listo para compilar tu app de navegación multimodal."
